name: RAG Eval CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI checks
        run: |
          python scripts/run_ci_checks.py

      - name: Upload eval suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-suite-artifacts
          path: eval_suite_artifacts
          retention-days: 14